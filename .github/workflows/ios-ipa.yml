name: Build iGaming for iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.example.igaming' }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Corregir configuración de compilación
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("iGaming/ContentView.swift")
          source = source_path.read_text(encoding="utf-8")

          fixes = [
              ("value: $sync, focused: focus == 0", "focused: focus == 0, value: $sync"),
              ("value: $notifications, focused: focus == 1", "focused: focus == 1, value: $notifications"),
          ]

          for old, new in fixes:
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit(f"No se encontró el código esperado en {source_path}: {old}")

          source_path.write_text(source, encoding="utf-8")

          project_path = Path("project.yml")
          project = project_path.read_text(encoding="utf-8")

          if "GENERATE_INFOPLIST_FILE:" not in project:
              anchor = "        PRODUCT_NAME: iGaming\n"
              if anchor not in project:
                  raise SystemExit(f"No se encontró la configuración esperada en {project_path}")
              project = project.replace(
                  anchor,
                  anchor + "        GENERATE_INFOPLIST_FILE: YES\n",
                  1
              )
              project_path.write_text(project, encoding="utf-8")
          PY

      - name: Detectar credenciales de Apple
        id: signing
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [[ -n "$P12" && -n "$PROFILE" && -n "$P12_PASSWORD" && -n "$TEAM_ID" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar XcodeGen y generar proyecto
        id: generate
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Compilar app para simulador
        id: build-simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project iGaming.xcodeproj \
            -scheme iGaming \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/simulator-build.log"

          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/iGaming.app" \
            "$RUNNER_TEMP/iGaming-Simulator.zip"

      - name: Subir app para simulador
        id: upload-simulator
        if: steps.build-simulator.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: iGaming-Simulator
          path: ${{ runner.temp }}/iGaming-Simulator.zip
          if-no-files-found: error
          retention-days: 14

      - name: Instalar certificado y perfil de Apple
        id: install-signing
        if: steps.signing.outputs.available == 'true'
        env:
          P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/igaming.keychain-db"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          runner_temp.joinpath("signing.p12").write_bytes(
              base64.b64decode(os.environ["P12"])
          )
          runner_temp.joinpath("profile.mobileprovision").write_bytes(
              base64.b64decode(os.environ["PROFILE"])
          )
          PY

          security create-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$P12_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/signing.p12" \
            -P "$P12_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$P12_PASSWORD" \
            "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D \
            -i "$RUNNER_TEMP/profile.mobileprovision" \
            > "$RUNNER_TEMP/profile.plist"

          PROFILE_UUID=$(/usr/libexec/PlistBuddy \
            -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy \
            -c 'Print Name' "$RUNNER_TEMP/profile.plist")

          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Crear archivo firmado para iPhone
        id: archive
        if: steps.install-signing.outcome == 'success'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project iGaming.xcodeproj \
            -scheme iGaming \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iGaming.xcarchive" \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            archive 2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Exportar IPA
        id: export-ipa
        if: steps.archive.outcome == 'success'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$IOS_BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/iGaming.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            2>&1 | tee "$RUNNER_TEMP/export-ipa.log"

      - name: Subir IPA
        id: upload-ipa
        if: steps.export-ipa.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: iGaming-IPA
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Informar resultado
        if: always()
        env:
          GENERATE_RESULT: ${{ steps.generate.outcome }}
          SIMULATOR_RESULT: ${{ steps.build-simulator.outcome }}
          SIMULATOR_UPLOAD_RESULT: ${{ steps.upload-simulator.outcome }}
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          SIGNING_INSTALL_RESULT: ${{ steps.install-signing.outcome }}
          ARCHIVE_RESULT: ${{ steps.archive.outcome }}
          IPA_EXPORT_RESULT: ${{ steps.export-ipa.outcome }}
          IPA_UPLOAD_RESULT: ${{ steps.upload-ipa.outcome }}
        run: |
          if [[ "$GENERATE_RESULT" != "success" ]]; then
            echo "Falló la generación del proyecto Xcode." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SIMULATOR_RESULT" != "success" ]]; then
            echo "Falló la compilación para simulador. Errores y advertencias:" >> "$GITHUB_STEP_SUMMARY"
            if [[ -f "$RUNNER_TEMP/simulator-build.log" ]]; then
              grep -E 'error:|warning:|BUILD FAILED|The following build commands failed' \
                "$RUNNER_TEMP/simulator-build.log" | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          elif [[ "$SIMULATOR_UPLOAD_RESULT" == "success" ]]; then
            echo "Se creó y subió iGaming-Simulator.zip." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ "$SIGNING_AVAILABLE" != "true" ]]; then
            echo "No se creó un IPA instalable porque faltan las credenciales de Apple: IOS_CERTIFICATE_P12_BASE64, IOS_PROVISIONING_PROFILE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_TEAM_ID y la variable IOS_BUNDLE_ID." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SIMULATOR_RESULT" == "success" && "$SIGNING_INSTALL_RESULT" != "success" ]]; then
            echo "Falló la instalación del certificado o del perfil de Apple." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$ARCHIVE_RESULT" != "success" && "$ARCHIVE_RESULT" != "skipped" ]]; then
            echo "Falló la creación del archivo firmado para iPhone." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$IPA_EXPORT_RESULT" != "success" && "$IPA_EXPORT_RESULT" != "skipped" ]]; then
            echo "Falló la exportación del IPA." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$IPA_UPLOAD_RESULT" == "success" ]]; then
            echo "Se creó y subió iGaming-IPA." >> "$GITHUB_STEP_SUMMARY"
          fi
