name: Build iGaming IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Corregir configuración del proyecto
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("iGaming/ContentView.swift")
          source = source_path.read_text(encoding="utf-8")

          fixes = [
              ("value: $sync, focused: focus == 0", "focused: focus == 0, value: $sync"),
              ("value: $notifications, focused: focus == 1", "focused: focus == 1, value: $notifications"),
          ]

          for old, new in fixes:
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit(f"No se encontró el código esperado: {old}")

          source_path.write_text(source, encoding="utf-8")

          project_path = Path("project.yml")
          project = project_path.read_text(encoding="utf-8")

          if "GENERATE_INFOPLIST_FILE:" not in project:
              anchor = "        PRODUCT_NAME: iGaming\n"
              if anchor not in project:
                  raise SystemExit("No se encontró PRODUCT_NAME en project.yml")
              project = project.replace(
                  anchor,
                  anchor + "        GENERATE_INFOPLIST_FILE: YES\n",
                  1
              )
              project_path.write_text(project, encoding="utf-8")
          PY

      - name: Generar proyecto Xcode
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Compilar y empaquetar iGaming.ipa
        run: |
          set -euo pipefail

          xcodebuild \
            -project iGaming.xcodeproj \
            -scheme iGaming \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iGaming.xcarchive" \
            GENERATE_INFOPLIST_FILE=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

          APP_PATH="$RUNNER_TEMP/iGaming.xcarchive/Products/Applications/iGaming.app"
          test -d "$APP_PATH"

          PACKAGE_PATH="$RUNNER_TEMP/ipa-package"
          mkdir -p "$PACKAGE_PATH/Payload"
          ditto "$APP_PATH" "$PACKAGE_PATH/Payload/iGaming.app"

          cd "$PACKAGE_PATH"
          zip -qry "$RUNNER_TEMP/iGaming.ipa" Payload
          test -f "$RUNNER_TEMP/iGaming.ipa"

      - name: Subir iGaming.ipa
        uses: actions/upload-artifact@v4
        with:
          name: iGaming-IPA
          path: ${{ runner.temp }}/iGaming.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Informar resultado
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/iGaming.ipa" ]]; then
            echo "Se generó iGaming.ipa y se subió como artefacto iGaming-IPA. La IPA no está firmada; hay que firmarla antes de instalarla en un iPhone." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No se pudo generar iGaming.ipa. Errores de compilación:" >> "$GITHUB_STEP_SUMMARY"
            if [[ -f "$RUNNER_TEMP/xcodebuild.log" ]]; then
              grep -E 'error:|BUILD FAILED|The following build commands failed' \
                "$RUNNER_TEMP/xcodebuild.log" | tail -n 40 >> "$GITHUB_STEP_SUMMARY" || true
            fi
          fi
