name: iGaming
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  iGaming:
    type: application
    platform: iOS
    sources:
      - path: iGaming
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.igaming
        PRODUCT_NAME: iGaming
        INFOPLIST_KEY_CFBundleDisplayName: iGaming
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
